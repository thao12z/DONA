version: '3.8'

services:
  app:
    build: .
    container_name: google-maps-scraper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/scraper.db
    volumes:
      # Persist database
      - ./data:/app/data
      # Persist Chromium cache
      - chromium-cache:/root/.cache/chromium
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chromium-cache:
